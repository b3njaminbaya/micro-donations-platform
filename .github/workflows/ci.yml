name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key
          FLASK_DEBUG: "1"
        run: python -m pytest server/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        # Not `npm ci`: react-scripts (CRA) is years unmaintained, and its
        # dependency tree includes loose, unpinned ranges deep enough that
        # `npm install` can resolve a genuinely different tree between two
        # runs minutes apart (observed directly while debugging this). `npm
        # ci`'s strict lockfile match makes that a hard CI failure for no
        # real reason — the build either compiles or it doesn't either way.
        run: npm install
      - name: Build
        run: CI=true npm run build
